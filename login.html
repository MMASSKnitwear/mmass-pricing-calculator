<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MMASS Pricing Login</title><meta name="theme-color" content="#07101e">
<style>
:root{--bg:#07101e;--p:#121a2d;--p2:#18223a;--line:#283451;--txt:#eef3ff;--muted:#9eabc6;--cyan:#2dd4bf;--bad:#ef4444}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at top,#17305b55,transparent 35%),linear-gradient(#07101e,#0b1020);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.card{width:min(430px,100%);background:linear-gradient(var(--p2),var(--p));border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 20px 60px #0007}.brand{font-weight:950;font-size:25px}.brand small{display:block;color:var(--muted);font-size:12px;margin-top:5px}.hr{height:1px;background:var(--line);margin:20px 0}label{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:850;margin:13px 0 6px}input{width:100%;padding:13px;background:#0c1425;border:1px solid #30405e;border-radius:11px;color:var(--txt);font-size:16px;outline:0}input:focus{border-color:#60a5fa}button{width:100%;border:0;border-radius:11px;padding:13px;margin-top:17px;background:var(--cyan);color:#05110e;font-weight:950;font-size:16px}.msg{min-height:20px;color:#fca5a5;font-size:12px;margin-top:12px}.muted{color:var(--muted);font-size:12px;line-height:1.5}
</style>
</head><body>
<form class="card" id="loginForm">
<div class="brand">MMASS Pricing<small>Cost & Profitability Engine</small></div>
<div class="hr"></div>
<h2 style="margin:0 0 6px">Sign in</h2>
<div class="muted">Use an approved MMASS email address and the shared app password.</div>
<label>Email</label><input id="email" type="email" autocomplete="username" required placeholder="name@mmass.net">
<label>Password</label><input id="password" type="password" autocomplete="current-password" required>
<button id="submit" type="submit">Sign In</button><div class="msg" id="msg"></div>
</form>
<script>
const f=document.getElementById('loginForm'),m=document.getElementById('msg'),b=document.getElementById('submit');
f.addEventListener('submit',async e=>{e.preventDefault();m.textContent='';b.disabled=true;b.textContent='Signing in…';try{
 const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});
 const j=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error(j.error||'Unable to sign in.');
 location.replace('/');
}catch(err){m.textContent=err.message}finally{b.disabled=false;b.textContent='Sign In'}});
(async()=>{try{const r=await fetch('/api/session',{cache:'no-store'});const j=await r.json();if(j.configured&&j.authenticated)location.replace('/')}catch{}})();
</script>
</body></html>
